<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Номерок</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Roboto+Condensed:wght@500;700&display=swap">
<style>
/* Layout: одноколоночное мини-приложение Telegram — шапка с поиском, чипы фильтров, лента карточек с табличками, нижние шторки */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --fg:#121820; --muted:#5d6878; --line:#dde2ea;
  --accent:#0d6efd; --accent-fg:#ffffff; --accent-soft:#e3ecf9;
  --tg:#2a9fd8; --wa:#1fa855; --ok:#1f8a4c;
  --plate-bg:#ffffff; --plate-fg:#0d0d0d;
  --shadow:0 1px 2px rgba(18,24,32,.06),0 4px 14px rgba(18,24,32,.05);
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-plate:"Roboto Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1520; --surface:#1a2332; --fg:#f6f9fd; --muted:#aab6c7; --line:#2c3a50;
  --accent:#3d8bff; --accent-fg:#ffffff; --accent-soft:#1c3157;
  --tg:#3fb0e6; --wa:#34c46d; --ok:#4cc27f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1520; --surface:#1a2332; --fg:#f6f9fd; --muted:#aab6c7; --line:#2c3a50;
  --accent:#3d8bff; --accent-fg:#ffffff; --accent-soft:#1c3157;
  --tg:#3fb0e6; --wa:#34c46d; --ok:#4cc27f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
header>*{min-width:0}
.wrap{width:100%;min-width:0}
html,body{overflow-x:hidden}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.brand h1 b{color:var(--accent)}
.brand small{color:var(--muted);font-size:13px;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.search input{border:0;background:none;outline:none;flex:1;min-width:0;font-size:16px;text-transform:uppercase}
.search input::placeholder{text-transform:none;color:var(--muted)}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.row{display:flex;gap:8px;align-items:center}
.row select{flex:1;min-width:0;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 10px}

.meta{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:13px;margin:6px 2px 10px}
.meta em{font-style:normal;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:12px}
.list{display:grid;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px;cursor:pointer;text-align:left;border:0;width:100%}
.card:hover{outline:1px solid var(--line)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.price{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.card-sub{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:40px 10px;background:var(--surface);border-radius:14px}

/* Табличка ГОСТ Р 50577: белая, чёрная окантовка, регион справа с RUS и флагом */
.plate{display:inline-flex;align-items:stretch;background:var(--plate-bg);color:var(--plate-fg);border:2px solid var(--plate-fg);border-radius:7px;
  font-family:var(--f-plate);font-weight:700;line-height:1;height:46px;box-shadow:inset 0 0 0 2px var(--plate-bg),inset 0 0 0 3px rgba(0,0,0,.18);user-select:all}
.plate .num{display:flex;align-items:flex-end;gap:3px;padding:0 9px 5px;font-size:34px;letter-spacing:.01em}
.plate .num .l{font-size:26px;padding-bottom:1px}
.plate .reg{border-left:2px solid var(--plate-fg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px;min-width:44px}
.plate .reg b{font-size:24px;letter-spacing:.01em}
.plate .rus{display:flex;align-items:center;gap:2px;font-size:8.5px;font-weight:700;margin-top:2px}
.flag{width:11px;height:7px;border:.5px solid #777;background:linear-gradient(#fff 0 33.3%,#1c3f9c 33.3% 66.6%,#d52b1e 66.6%)}
.plate.lg{height:62px;border-radius:9px}
.plate.lg .num{font-size:46px;padding:0 12px 6px}.plate.lg .num .l{font-size:35px}
.plate.lg .reg{min-width:58px}.plate.lg .reg b{font-size:32px}.plate.lg .rus{font-size:11px}
.plate.lg .flag{width:14px;height:9px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;height:50px;padding:0 26px;font-weight:600;font-size:16px;box-shadow:0 6px 22px rgba(13,110,253,.45);cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap}

/* Шторки */
.scrim{position:fixed;inset:0;background:rgba(6,10,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  animation:up .22s ease-out;display:grid;gap:16px}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:19px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--muted)}
.center{display:flex;justify-content:center;padding:6px 0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.facts dt{color:var(--muted)}.facts dd{margin:0;min-width:0}
.desc{margin:0;color:var(--fg)}
.seller{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg)}
.ava{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.seller div{min-width:0}.seller b{display:block}.seller span{color:var(--muted);font-size:13px}
.contacts{display:grid;gap:8px}
.cbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:12px;font-weight:600;text-decoration:none;color:#fff}
.cbtn.tg{background:var(--tg)}.cbtn.wa{background:var(--wa)}
.copyrow{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.copyrow code{font-family:var(--f-body);color:var(--fg);background:var(--bg);padding:3px 8px;border-radius:6px;user-select:all}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;padding:2px 4px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin:0}

form{display:grid;gap:14px}
.f{display:grid;gap:5px}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f textarea,.f select{height:44px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 12px;font-size:16px;width:100%;min-width:0}
.f textarea{height:auto;min-height:74px;padding:10px 12px;resize:vertical}
.plate-in{display:grid;grid-template-columns:1fr 1.4fr 1.2fr 1.1fr;gap:6px}
.plate-in input{text-align:center;text-transform:uppercase;font-family:var(--f-plate);font-weight:700;font-size:20px;padding:0 4px}
.hint{font-size:12px;color:var(--muted)}
.err{font-size:12px;color:#d0342c}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.submit{height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:16px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:380px){.plate .num{font-size:29px}.plate .num .l{font-size:22px}.plate .reg b{font-size:21px}}
.brand-r{display:flex;align-items:center;gap:10px}
.mine-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer;color:var(--accent)}
.fixed{height:44px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--fg);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine{display:grid;gap:10px}
.mine-item{display:grid;gap:10px;padding:12px;border-radius:12px;background:var(--bg)}
.mine-actions{display:flex;gap:8px}
.btn2{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.btn2.danger{color:#d0342c}
.btn2:disabled,.submit:disabled{opacity:.6}
.st{font-weight:600;font-size:12px;padding:2px 8px;border-radius:6px}
.st-pending{background:rgba(232,160,20,.16);color:#c07c00}
.st-active{background:rgba(31,138,76,.15);color:var(--ok)}
.st-sold{background:var(--accent-soft);color:var(--accent)}
.st-rejected{background:rgba(208,52,44,.14);color:#d0342c}
.report{justify-self:center;color:var(--muted)}
a.cbtn{cursor:pointer}
</style>

</head><body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Номер<b>ок</b></h1>
      <div class="brand-r"><small id="count"></small><button type="button" class="mine-btn" id="mineBtn">Мои</button></div>
    </div>
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск: 777, АМР, регион 77…" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Категории"></div>
    <div class="row">
      <select id="region" aria-label="Регион"></select>
      <select id="sort" aria-label="Сортировка">
        <option value="new">Сначала новые</option>
        <option value="cheap">Сначала дешевле</option>
        <option value="exp">Сначала дороже</option>
      </select>
    </div>
  </header>

  <div class="meta"><span id="found"></span></div>
  <main class="list" id="list"></main>
</div>

<button class="fab" id="add" type="button">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
  Разместить номер
</button>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
const SB_URL = "https://rfruubhnlvvvztxhlvez.supabase.co";
const SB_KEY = "sb_publishable_5AWwTmYpR3D35c5RSTD4GQ_3H6pTsDq";
const FN_URL = SB_URL + "/functions/v1/nomerok";
const BOT_LINK = "https://t.me/Nomerok95_bot";

const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
const TGU = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
if (TG) {
  TG.ready(); TG.expand();
  if (TG.colorScheme) document.documentElement.dataset.theme = TG.colorScheme;
  try { TG.setHeaderColor("bg_color"); } catch(e) {}
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.cbtn"); if (!a || !TG) return;
  e.preventDefault();
  if (a.href.startsWith("https://t.me/")) TG.openTelegramLink(a.href); else TG.openLink(a.href);
});

const LETTERS = "АВЕКМНОРСТУХ";
const LAT = {A:"А",B:"В",E:"Е",K:"К",M:"М",H:"Н",O:"О",P:"Р",C:"С",T:"Т",Y:"У",X:"Х"};
const toCyr = s => s.toUpperCase().split("").map(c => LAT[c] || c).join("");
const REGIONS = {"01":"Адыгея","02":"Башкортостан","102":"Башкортостан","05":"Дагестан","07":"Кабардино-Балкария","09":"Карачаево-Черкесия","15":"Северная Осетия","16":"Татарстан","116":"Татарстан","716":"Татарстан","20":"Чечня","95":"Чечня","06":"Ингушетия","23":"Краснодарский край","93":"Краснодарский край","123":"Краснодарский край","26":"Ставропольский край","126":"Ставропольский край","24":"Красноярский край","25":"Приморский край","34":"Волгоградская обл.","36":"Воронежская обл.","38":"Иркутская обл.","39":"Калининградская обл.","42":"Кемеровская обл.","50":"Московская обл.","90":"Московская обл.","150":"Московская обл.","190":"Московская обл.","750":"Московская обл.","52":"Нижегородская обл.","152":"Нижегородская обл.","54":"Новосибирская обл.","154":"Новосибирская обл.","55":"Омская обл.","59":"Пермский край","61":"Ростовская обл.","161":"Ростовская обл.","761":"Ростовская обл.","63":"Самарская обл.","163":"Самарская обл.","763":"Самарская обл.","64":"Саратовская обл.","66":"Свердловская обл.","96":"Свердловская обл.","196":"Свердловская обл.","72":"Тюменская обл.","74":"Челябинская обл.","174":"Челябинская обл.","77":"Москва","97":"Москва","99":"Москва","177":"Москва","197":"Москва","199":"Москва","777":"Москва","797":"Москва","799":"Москва","977":"Москва","78":"Санкт-Петербург","98":"Санкт-Петербург","178":"Санкт-Петербург","198":"Санкт-Петербург","47":"Ленинградская обл.","147":"Ленинградская обл.","82":"Крым","92":"Севастополь","86":"ХМАО — Югра","186":"ХМАО — Югра","89":"ЯНАО"};
const regName = r => REGIONS[r] || "Регион " + r;

let ads = [];
let loadState = "loading"; // loading | ok | error

function tagsOf(a){
  const t=[], d=a.d;
  if(d[0]===d[1]&&d[1]===d[2]) t.push("same");
  else if(d[0]===d[2]) t.push("mirror");
  if(/^[1-9]00$/.test(d)) t.push("round");
  if(d.startsWith("00")) t.push("zero");
  if(a.l1===a.l2[0]&&a.l2[0]===a.l2[1]) t.push("letters");
  return t;
}
const TAGS = {same:"Одинаковые цифры",mirror:"Зеркальные",round:"Круглые",zero:"Нули в начале",letters:"Одинаковые буквы"};
const CHIPS = [["all","Все"],["same","Одинаковые цифры"],["mirror","Зеркальные"],["letters","Одинаковые буквы"],["round","Круглые"],["zero","Нули в начале"]];
const STATUS = {pending:["На проверке","st-pending"],active:["Опубликовано","st-active"],sold:["Продано","st-sold"],rejected:["Отклонено","st-rejected"]};

const fmt = n => new Intl.NumberFormat("ru-RU").format(n) + " ₽";
const daysAgo = iso => Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 86400000));
function ago(iso){ const d=daysAgo(iso); if(d===0) return "сегодня"; if(d===1) return "вчера"; const m10=d%10, m100=d%100; const w=(m10===1&&m100!==11)?"день":(m10>=2&&m10<=4&&(m100<12||m100>14))?"дня":"дней"; return d+" "+w+" назад"; }
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plural = (n,a,b,c) => { const m10=n%10,m100=n%100; return (m10===1&&m100!==11)?a:(m10>=2&&m10<=4&&(m100<12||m100>14))?b:c; };

function plate(a,lg){
  return `<span class="plate${lg?" lg":""}" aria-label="Номер ${esc(a.l1)}${esc(a.d)}${esc(a.l2)} ${esc(a.r)}">
    <span class="num"><span class="l">${esc(a.l1)}</span>${esc(a.d)}<span class="l">${esc(a.l2)}</span></span>
    <span class="reg"><b>${esc(a.r)}</b><span class="rus">RUS <i class="flag"></i></span></span></span>`;
}

const state = {q:"",chip:"all",region:"all",sort:"new"};
const $ = id => document.getElementById(id);

/* ---------- сеть ---------- */
async function loadAds(){
  loadState="loading"; render();
  try{
    const r = await fetch(SB_URL+"/rest/v1/active_listings?select=*&order=published_at.desc&limit=500",{headers:{apikey:SB_KEY}});
    if(!r.ok) throw new Error(await r.text());
    ads = await r.json(); loadState="ok";
  }catch(e){ console.error(e); loadState="error"; }
  renderRegions(); render();
}
async function api(action, data={}){
  if(!TG) throw new Error("Чтобы размещать объявления, откройте Номерок через бота в Telegram.");
  const r = await fetch(FN_URL,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({action,initData:TG.initData,...data})});
  let j={}; try{ j=await r.json(); }catch{}
  if(!r.ok || j.error) throw new Error(j.error || "Сервер не ответил. Попробуйте ещё раз.");
  return j;
}

/* ---------- лента ---------- */
function renderChips(){
  $("chips").innerHTML = CHIPS.map(([k,v])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${state.chip===k}">${v}</button>`).join("");
}
function renderRegions(){
  const rs=[...new Set(ads.map(a=>a.r))].sort((a,b)=>a-b);
  const cur=state.region;
  $("region").innerHTML = `<option value="all">Все регионы</option>` + rs.map(r=>`<option value="${esc(r)}">${esc(r)} · ${esc(regName(r))}</option>`).join("");
  $("region").value = rs.includes(cur)?cur:"all";
  if($("region").value!==cur) state.region="all";
}
function render(){
  $("count").textContent = loadState==="ok" ? ads.length+" "+plural(ads.length,"объявление","объявления","объявлений") : "";
  if(loadState==="loading"){ $("found").textContent=""; $("list").innerHTML=`<div class="empty">Загружаем объявления…</div>`; return; }
  if(loadState==="error"){ $("found").textContent=""; $("list").innerHTML=`<div class="empty">Не удалось загрузить объявления. Проверьте интернет.<br><button class="linkbtn" type="button" id="retry">Повторить</button></div>`; return; }
  if(!ads.length){ $("found").textContent=""; $("list").innerHTML=`<div class="empty"><b>Пока нет ни одного объявления.</b><br>Разместите свой номер первым — кнопка внизу.</div>`; return; }
  const q = toCyr(state.q.replace(/\s+/g,""));
  let list = ads.filter(a=>{
    if(state.chip!=="all" && !tagsOf(a).includes(state.chip)) return false;
    if(state.region!=="all" && a.r!==state.region) return false;
    if(q){ const full=(a.l1+a.d+a.l2+a.r); if(!full.includes(q) && !(a.l1+a.l2).includes(q) && a.r!==q) return false; }
    return true;
  });
  list.sort((a,b)=>state.sort==="cheap"?a.price-b.price:state.sort==="exp"?b.price-a.price:new Date(b.published_at)-new Date(a.published_at));
  $("found").textContent = "Найдено: "+list.length;
  $("list").innerHTML = list.length ? list.map(a=>`
    <button type="button" class="card" data-id="${a.id}">
      <div class="card-top">${plate(a)}<span class="price">${fmt(a.price)}</span></div>
      ${tagsOf(a).length?`<div class="tags">${tagsOf(a).map(t=>`<span class="tag">${TAGS[t]}</span>`).join("")}</div>`:""}
      <div class="card-sub"><span>${esc(a.city || regName(a.r))} · ${esc(a.seller_name)}</span><span>${ago(a.published_at)}</span></div>
    </button>`).join("")
    : `<div class="empty">Ничего не нашлось.<br>Попробуйте другой регион или уберите фильтр.</div>`;
}

/* ---------- шторки ---------- */
function openSheet(html){ $("scrim").innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; $("scrim").hidden=false; document.body.style.overflow="hidden"; }
function closeSheet(){ $("scrim").hidden=true; $("scrim").innerHTML=""; document.body.style.overflow=""; }
$("scrim").addEventListener("click",e=>{ if(e.target.id==="scrim"||e.target.closest(".x")) closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
const head = t => `<div class="grip"></div><div class="sheet-head"><h2>${t}</h2><button class="x" type="button" aria-label="Закрыть">✕</button></div>`;

function showAd(a){
  const waNice = a.wa ? "+"+a.wa.replace(/^(\d)(\d{3})(\d{3})(\d{2})(\d{2})$/,"$1 $2 $3-$4-$5") : "";
  const msg = "Здравствуйте! Пишу по объявлению в Номерке о номере "+a.l1+a.d+a.l2+" "+a.r;
  openSheet(`
    ${head(fmt(a.price))}
    <div class="center">${plate(a,true)}</div>
    ${tagsOf(a).length?`<div class="tags">${tagsOf(a).map(t=>`<span class="tag">${TAGS[t]}</span>`).join("")}</div>`:""}
    <dl class="facts"><dt>Регион</dt><dd>${esc(a.r)} · ${esc(regName(a.r))}</dd>${a.city?`<dt>Город</dt><dd>${esc(a.city)}</dd>`:""}<dt>Размещено</dt><dd>${ago(a.published_at)}</dd></dl>
    ${a.descr?`<p class="desc">${esc(a.descr)}</p>`:""}
    <div class="seller"><div class="ava">${esc((a.seller_name||"?")[0])}</div><div><b>${esc(a.seller_name)}</b><span>Частное лицо</span></div></div>
    <div class="contacts">
      ${a.seller_username?`<a class="cbtn tg" href="https://t.me/${esc(a.seller_username)}" target="_blank" rel="noopener">Написать в Telegram</a>
        <div class="copyrow">Telegram: <code>@${esc(a.seller_username)}</code><button class="linkbtn" data-copy="@${esc(a.seller_username)}" type="button">Скопировать</button></div>`:""}
      ${a.wa?`<a class="cbtn wa" href="https://wa.me/${esc(a.wa)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Написать в WhatsApp</a>
        <div class="copyrow">WhatsApp: <code>${waNice}</code><button class="linkbtn" data-copy="${waNice}" type="button">Скопировать</button></div>`:""}
    </div>
    <p class="note">Номер переоформляется вместе с автомобилем или через сохранение номера в ГИБДД. Не переводите предоплату незнакомым людям.</p>
    <button class="linkbtn report" type="button" data-report="${a.id}">Пожаловаться на объявление</button>`);
}

function showReport(id){
  const a = ads.find(x=>x.id==id); if(!a) return;
  openSheet(`${head("Жалоба")}
    <div class="center">${plate(a,true)}</div>
    <form id="rf" novalidate>
      <div class="f"><label for="r-why">Что не так?</label>
        <select id="r-why"><option>Мошенничество</option><option>Номер уже продан</option><option>Неверная цена или данные</option><option>Другое</option></select></div>
      <div class="f"><label for="r-txt">Подробнее (необязательно)</label><textarea id="r-txt"></textarea></div>
      <span class="err" id="r-err" hidden></span>
      <button class="submit" type="submit">Отправить жалобу</button>
    </form>`);
  $("rf").addEventListener("submit",async e=>{
    e.preventDefault(); const btn=e.target.querySelector(".submit"); btn.disabled=true;
    try{ await api("report",{id:a.id,reason:$("r-why").value+($("r-txt").value.trim()?": "+$("r-txt").value.trim():"")}); closeSheet(); toast("Жалоба отправлена модератору"); }
    catch(err){ $("r-err").textContent=err.message; $("r-err").hidden=false; btn.disabled=false; }
  });
}

$("scrim").addEventListener("click",async e=>{
  const b=e.target.closest("[data-copy]");
  if(b){
    try{ await navigator.clipboard.writeText(b.dataset.copy); toast("Скопировано"); }
    catch{ const c=b.previousElementSibling; const r=document.createRange(); r.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Выделено — скопируйте вручную"); }
    return;
  }
  const rp=e.target.closest("[data-report]"); if(rp){ showReport(rp.dataset.report); return; }
  const act=e.target.closest("[data-act]");
  if(act){
    const {act:kind,id}=act.dataset;
    if(act.dataset.confirm!=="1"){ act.dataset.confirm="1"; act.dataset.label=act.textContent; act.textContent=kind==="sold"?"Точно продано?":"Точно снять?"; setTimeout(()=>{ if(act.isConnected){ act.dataset.confirm=""; act.textContent=act.dataset.label; } },3000); return; }
    act.disabled=true;
    try{ await api(kind,{id:Number(id)}); toast(kind==="sold"?"Отмечено как продано":"Объявление снято"); loadAds(); showMine(); }
    catch(err){ toast(err.message); act.disabled=false; }
  }
});

/* ---------- мои объявления ---------- */
async function showMine(){
  if(!TG){ openSheet(`${head("Мои объявления")}<p class="desc">Свои объявления можно смотреть, когда Номерок открыт через бота в Telegram.</p><a class="cbtn tg" href="${BOT_LINK}" target="_blank" rel="noopener">Открыть бота</a>`); return; }
  openSheet(`${head("Мои объявления")}<div class="empty" id="mine">Загружаем…</div>`);
  try{
    const {items} = await api("my");
    if(!$("mine")) return;
    $("mine").outerHTML = items.length ? `<div class="mine">${items.map(a=>{
      const [label,cls]=STATUS[a.status]||[a.status,""];
      const canAct = a.status==="pending"||a.status==="active";
      return `<div class="mine-item">
        <div class="card-top">${plate(a)}<span class="price">${fmt(a.price)}</span></div>
        <div class="card-sub"><span class="st ${cls}">${label}</span><span>${ago(a.created_at)}</span></div>
        ${canAct?`<div class="mine-actions">${a.status==="active"?`<button type="button" class="btn2" data-act="sold" data-id="${a.id}">Продано</button>`:""}<button type="button" class="btn2 danger" data-act="remove" data-id="${a.id}">Снять</button></div>`:""}
      </div>`;}).join("")}</div>`
      : `<div class="empty" id="mine">У вас пока нет объявлений.</div>`;
  }catch(err){ if($("mine")) $("mine").textContent=err.message; }
}

/* ---------- форма ---------- */
function showForm(){
  if(!TG){ openSheet(`${head("Разместить номер")}<p class="desc">Объявления размещаются через Telegram: так покупатели видят ваш настоящий контакт, а мы защищаем доску от фейков.</p><a class="cbtn tg" href="${BOT_LINK}" target="_blank" rel="noopener">Открыть бота</a>`); return; }
  const uname = TGU && TGU.username;
  openSheet(`
    ${head("Новое объявление")}
    <div class="center" id="pv"></div>
    <form id="f" novalidate>
      <div class="f"><label>Номер</label>
        <div class="plate-in">
          <input id="f-l1" maxlength="1" placeholder="А" aria-label="Первая буква" autocomplete="off">
          <input id="f-d" maxlength="3" inputmode="numeric" placeholder="123" aria-label="Цифры" autocomplete="off">
          <input id="f-l2" maxlength="2" placeholder="ВС" aria-label="Две буквы" autocomplete="off">
          <input id="f-r" maxlength="3" inputmode="numeric" placeholder="77" aria-label="Регион" autocomplete="off">
        </div>
        <span class="hint">Буквы только: ${LETTERS.split("").join(" ")}. Можно набирать латиницей.</span>
        <span class="err" id="e-plate" hidden></span>
      </div>
      <div class="two">
        <div class="f"><label for="f-price">Цена, ₽</label><input id="f-price" inputmode="numeric" placeholder="250 000"></div>
        <div class="f"><label for="f-city">Город</label><input id="f-city" placeholder="Москва" maxlength="60"></div>
      </div>
      <div class="f"><label>Telegram для связи</label>
        <div class="fixed">${uname?"@"+esc(uname):"У вас нет @username в Telegram"}</div>
        <span class="hint">${uname?"Берётся из вашего Telegram автоматически.":"Укажите WhatsApp ниже или задайте username в настройках Telegram."}</span></div>
      <div class="f"><label for="f-wa">WhatsApp ${uname?"(необязательно)":""}</label><input id="f-wa" inputmode="tel" placeholder="+7 900 000-00-00"></div>
      <span class="err" id="e-contact" hidden></span>
      <div class="f"><label for="f-desc">Описание</label><textarea id="f-desc" maxlength="500" placeholder="Как переоформляется, есть ли торг"></textarea></div>
      <span class="err" id="e-send" hidden></span>
      <button class="submit" type="submit">Отправить на проверку</button>
      <p class="note">Объявление появится в ленте после проверки модератором. Обычно это занимает до нескольких часов.</p>
    </form>`);
  const v = id => $(id).value.trim();
  const upd = () => {
    ["f-l1","f-l2"].forEach(id=>{ const el=$(id); const c=toCyr(el.value); if(c!==el.value) el.value=c; });
    $("pv").innerHTML = plate({l1:v("f-l1")||"_",d:v("f-d")||"___",l2:v("f-l2")||"__",r:v("f-r")||"__"},true);
  };
  $("f").addEventListener("input",upd); upd();
  $("f").addEventListener("submit",async e=>{
    e.preventDefault();
    const l1=toCyr(v("f-l1")), d=v("f-d"), l2=toCyr(v("f-l2")), r=v("f-r");
    const re = new RegExp(`^[${LETTERS}]$`), re2 = new RegExp(`^[${LETTERS}]{2}$`);
    let err="";
    if(!re.test(l1)||!re2.test(l2)) err="Проверьте буквы: допустимы только "+LETTERS.split("").join(", ")+".";
    else if(!/^\d{3}$/.test(d)||d==="000") err="Нужно три цифры, 000 не выдаётся.";
    else if(!/^\d{2,3}$/.test(r)) err="Код региона — 2 или 3 цифры.";
    $("e-plate").textContent=err; $("e-plate").hidden=!err;
    const wa=v("f-wa").replace(/\D/g,"").replace(/^8/,"7");
    const price=Number(v("f-price").replace(/\D/g,""));
    let cerr = (!uname && !wa) ? "Укажите номер WhatsApp, иначе покупатели не смогут связаться." : (wa && !/^7\d{10}$/.test(wa) ? "Номер WhatsApp: 11 цифр, например +7 900 000-00-00." : "");
    if(!cerr && !price) cerr="Укажите цену.";
    $("e-contact").textContent=cerr; $("e-contact").hidden=!cerr;
    if(err||cerr) return;
    const btn=e.target.querySelector(".submit"); btn.disabled=true; btn.textContent="Отправляем…";
    try{
      await api("create",{l1,d,l2,r,price,city:v("f-city"),descr:v("f-desc"),wa});
      closeSheet(); toast("Отправлено на проверку. Бот сообщит, когда объявление опубликуют.");
    }catch(er){ $("e-send").textContent=er.message; $("e-send").hidden=false; btn.disabled=false; btn.textContent="Отправить на проверку"; }
  });
}

let tt; function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,3200); }

$("chips").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; state.chip=b.dataset.k; renderChips(); render(); });
$("q").addEventListener("input",e=>{ state.q=e.target.value; render(); });
$("region").addEventListener("change",e=>{ state.region=e.target.value; render(); });
$("sort").addEventListener("change",e=>{ state.sort=e.target.value; render(); });
$("list").addEventListener("click",e=>{ if(e.target.id==="retry"){ loadAds(); return; } const c=e.target.closest(".card"); if(c) showAd(ads.find(a=>a.id==c.dataset.id)); });
$("add").addEventListener("click",showForm);
$("mineBtn").addEventListener("click",showMine);

renderChips(); renderRegions(); loadAds();
</script>

</body></html>
